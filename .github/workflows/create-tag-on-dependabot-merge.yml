name: Create Tag on Dependabot Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  create-tag:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Get version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP 'FROM caddy:\K[0-9.]+' Dockerfile | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Found Caddy version: $VERSION"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="v${{ steps.version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG

          Auto-generated by Dependabot + create-tag workflow
          Merged PR: #${{ github.event.pull_request.number }}"
          "
          git push origin "$TAG"
          echo "✅ Created and pushed tag: $TAG"

      - name: Notify
        run: |
          echo "🏷️ Tag v${{ steps.version.outputs.version }} created!"
          echo "🔄 Docker Build & Push workflow should trigger now..."